services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: meridian-dev:latest
    platform: linux/amd64
    working_dir: /work
    # solana-test-validator's accounts-db asserts io_uring support on Linux;
    # Docker's default seccomp profile blocks the io_uring_* syscalls on some
    # hosts/kernels, which otherwise crashes the validator on startup with
    # "assertion failed: io_uring_supported()". See DECISIONS.md §7, 2026-10-06.
    security_opt:
      - seccomp:unconfined
    volumes:
      - .:/work
      - cargo-registry:/usr/local/cargo/registry
      - target:/work/target
      - pnpm-store:/home/dev/.pnpm-store
      - ./keys:/run/keys:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
      - "127.0.0.1:${RPC_PORT:-8899}:8899"
      - "127.0.0.1:${WS_PORT:-8900}:8900"
      - "127.0.0.1:${STATUS_PORT:-8787}:8787"
    env_file:
      - path: ./.env
        required: false
    tty: true
    stdin_open: true

volumes:
  cargo-registry:
  target:
  pnpm-store:
