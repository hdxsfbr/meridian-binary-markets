[package]
name = "meridian"
version = "0.1.0"
description = "Binary stock outcome markets"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "meridian"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = "1.2.1"
anchor-spl = "1.2.1"
pyth-solana-receiver-sdk = "2.0.0"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
