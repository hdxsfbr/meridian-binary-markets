[package]
name = "meridian"
version = "0.1.0"
description = "Binary stock outcome markets"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "meridian"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = "1.2.1"
anchor-spl = "1.2.1"
pyth-solana-receiver-sdk = "2.0.0"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
litesvm = "0.12.0"
litesvm-token = "0.12.0"
# Pinned to the last 3.x release whose own `solana-pubkey` dependency is still v3
# (3.3.0+ moved to solana-pubkey v4, which would otherwise duplicate the v3 pulled in
# transitively by agave-feature-set/solana-address-lookup-table-interface etc. through
# litesvm 0.12.0 itself -- verified with `cargo tree -d`; see DECISIONS.md §7).
solana-account = "=3.2.0"
solana-address = "2"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "3"
solana-transaction-error = "3"
solana-message = "3"
solana-instruction = "3"
solana-system-interface = "2"
solana-clock = "3"
solana-sdk-ids = "3"
